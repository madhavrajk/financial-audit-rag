[project]
name = "financial-audit-rag"
version = "0.1.0"
description = "Local agentic RAG assistant over 10-K filings and structured financials, for any OpenAI-compatible model provider"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Offline batch job: blocking file I/O inside the async build is intentional.
"app/ingest/build_index.py" = ["ASYNC240"]
"eval/*" = ["ASYNC240"]

[tool.pyright]
include = ["app", "eval"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
